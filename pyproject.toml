[project]
name = "todooit"
version = "1.0.0"
description = "A beautiful, versatile todo app in your terminal for a keyboard based workflow."
requires-python = ">=3.9"
authors = [
    {name = "Georg Slamanig", email = "georgslamanig@gmail.com"}
]
license = "MIT"
readme = "README.md"
dependencies = [
    "click>=8.1.8",
    "platformdirs>=4.4.0",
    "pyperclip>=1.10.0",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.43",
    "textual>=6.1.0",
    "typing-extensions>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/gslama12/todooit"
Repository = "https://github.com/gslama12/todooit"

[project.scripts]
todooit = "todooit.__main__:main"

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "faker>=37.8.0",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.13.1",
    "textual-dev>=1.7.0",
    "types-pyperclip>=1.9.0.20250801",
    "types-python-dateutil>=2.9.0.20260124",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["todooit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
# Applied by filename in the root conftest, not by hand -- see FEATURE_BY_MODULE.
# `pytest -m <feature>` is the mechanical form of CLAUDE.md's "only run tests
# relevant to the change"; --strict-markers turns a typo into an error rather
# than a run that quietly selects nothing.
markers = [
  "core: pure-logic tests, no Textual app",
  "ui: drives a real Todooit app through a pilot",
  "smoke: the always-run sanity subset",
  "model: the base model",
  "todos: todos and the tasks pane",
  "projects: projects and the projects pane",
  "colors: project colors",
  "fixed: Today/Upcoming/Completed/Bin",
  "recycle: the recycle bin",
  "undo: undo and redo",
  "hooks: model hooks and validation",
  "quickadd: quick add",
  "links: links and the clipboard",
  "dates: date parsing, recurrence, the calendar",
  "notes: todo notes and the pinned note",
  "theming: themes and CSS",
  "persistence: paths, the database, sync polling",
  "shell: app shell, navigation, cross-feature workflows",
  "help: the help screen",
  "bar: the status bar and its widgets",
  "formatters: the render pipeline",
  "move: moving and refiling",
  "sort: sorting",
  "search: search and goto",
  "flash: flash mode (t) row labels",
  "editing: inline editing and the cursor",
  "config: the config API, loader and keys",
  "lifecycle: the todo lifecycle and the one refresh signal",
  "placement: where a todo lives (its home, root and bin row)",
  "layout: the rows a pane draws (guides, blocks, context rows, banding)",
  "migration: migrating a dooit database (migration/db_migration.py)",
]

[tool.ruff.lint]
# An explicit set rather than ruff's defaults: those grow between releases,
# and ruff is unpinned here, so an upgrade would otherwise change the rules
select = [
  "E4", "E7", "E9", "F",  # pycodestyle errors + pyflakes (ruff's classic defaults)
  "I",                    # import sorting
  "B",                    # bugbear: likely bugs
  "SIM",                  # simplifications
  "PIE",                  # unnecessary code
  "RUF100",               # noqa comments that no longer suppress anything
]
# `== True` / `== False` is how SQLAlchemy filters are written
ignore = ["E712"]

[tool.mypy]
# `uv run mypy` with no arguments checks all of these
files = ["todooit", "migration", "tests", "conftest.py"]
# The oldest target mypy still accepts; requires-python says 3.9
python_version = "3.10"
# tests/ has no __init__.py, so the root conftest.py and
# tests/test_ui/conftest.py would both be module "conftest" without this
explicit_package_bases = true
# Most of the package is unannotated; without this mypy skips those bodies
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.report]
omit = ["todooit/utils/default_config.py"]
